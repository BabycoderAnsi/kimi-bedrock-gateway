[pytest]
testpaths = tests
addopts = -m "not live" -p no:cacheprovider
markers =
    e2e: offline end-to-end tests that start the real LiteLLM proxy against tests/mock_bedrock.py
    claude: end-to-end tests that drive the installed Claude Code (gateway verify claude)
    live: real Amazon Bedrock calls; run only with KGW_LIVE_BEDROCK=1 and explicit consent (pytest -m live)
